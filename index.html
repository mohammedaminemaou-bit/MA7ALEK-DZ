function pwH(){var e=document.getElementById('pw'),h=document.getElementById('pwh'),bar=document.getElementById('pwb');if(!e||!h||!bar)return;var p=e.value;if(!p){h.textContent='';h.className='hint';bar.style.display='none';return}bar.style.display='block';var sc=0;if(p.length>=8)sc++;if(p.length>=11)sc++;if(/[a-z]/i.test(p)&&/\d/.test(p))sc++;if(/[^a-z0-9]/i.test(p))sc++;var easy=/^(.)\1+$/.test(p)||/^(0123456789|123456789|12345678|87654321|01234567)/.test(p);var t,c,w;if(p.length<8){t='قصيرة — 8 على الأقل';c='bad';w=20}else if(easy){t='سهلة التخمين، اختر غيرها';c='bad';w=30}else if(sc<=1){t='مقبولة';c='';w=50}else if(sc==2){t='جيدة';c='ok';w=75}else{t='قوية';c='ok';w=100}h.textContent=t;h.className='hint '+c;var i=bar.firstChild;i.style.width=w+'%';i.style.background=c=='bad'?'var(--rd)':c=='ok'?'#1a7f4b':'var(--am)'}
document.addEventListener('input',function(ev){var t=ev.target;if(t.id=='ph'){if(t.selectionStart==null||t.selectionStart>=t.value.length)t.value=fp(t.value);phH()}else if(t.id=='pw')pwH()});
document.addEventListener('keydown',function(ev){if(ev.key!='Enter')return;var t=ev.target;if(t.id=='ph'){var p=document.getElementById('pw');if(p){ev.preventDefault();p.focus()}}else if(t.id=='pw'){var b=document.querySelector('[data-a=in]');if(b&&!b.disabled){ev.preventDefault();b.click()}}});
new MutationObserver(function(){var e=document.getElementById('ph');if(e&&e.value&&!document.getElementById('phh').textContent)phH()}).observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>
/* اختصارات الكمبيوتر: F2 بيع · F3 السلعة · F4 الفواتير · F1 الرئيسية · / بحث */
(function(){var mq=window.matchMedia('(min-width:1024px)');
document.addEventListener('keydown',function(e){
if(!mq.matches||e.ctrlKey||e.metaKey||e.altKey)return;
var tg=(e.target&&e.target.tagName)||'',typing=/INPUT|TEXTAREA|SELECT/.test(tg);
var m={F1:'home',F2:'sale',F3:'stock',F4:'inv'}[e.key];
if(m&&typeof go==='function'&&document.body.dataset.v!=='login'&&document.body.dataset.v!=='lock'){e.preventDefault();go(m);return}
if(e.key==='/'&&!typing){var q=document.getElementById('q');if(q){e.preventDefault();q.focus();q.select&&q.select()}}
if(e.key==='Escape'&&typing)e.target.blur()});
})();
</script>
